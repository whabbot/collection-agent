[project]
name = "collection-agent"
version = "0.1.0"
description = "Payment-collection agent: chase policy and decision logic"
authors = [
    { name = "whabbot", email = "61473790+whabbot@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "holidays>=0.106",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

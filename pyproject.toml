[project]
name = "collection-agent"
version = "0.1.0"
description = "Payment-collection agent: chase policy and decision logic"
authors = [
    { name = "whabbot", email = "61473790+whabbot@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.2",
    "holidays>=0.106",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
    "stripe>=16.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
collection-agent = "collection_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: needs the compose Postgres test database (docker compose up -d db)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
